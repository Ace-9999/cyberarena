<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard | CyberArena</title>
    <!-- Import Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #05080a;
            --bg-soft: #0a1014;
            --green: #39ff88;
            --amber: #ffb000;
            --red: #ff3333;
            --cyan: #00e5ff;
            --text: #e0e0e0;
            --muted: #6b7280;
            --panel-bg: rgba(5, 8, 10, 0.85);
            --border: #39ff88;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            /* CRT scanlines */
            background-image: repeating-linear-gradient(
                0deg, rgba(0, 0, 0, 0.15) 0px, rgba(0, 0, 0, 0.15) 1px, transparent 1px, transparent 3px
            );
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 1.5rem;
            animation: fadeInUp 0.4s ease both;
        }

        .terminal-panel {
            border: 1px solid var(--border);
            background: var(--panel-bg);
            box-shadow: 0 0 15px rgba(57, 255, 136, 0.15);
            border-radius: 4px;
            overflow: hidden;
            transition: box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .terminal-panel:hover {
            box-shadow: 0 0 25px rgba(57, 255, 136, 0.35);
            border-color: var(--cyan);
        }

        .terminal-header {
            background: var(--bg-soft);
            border-bottom: 1px solid rgba(57, 255, 136, 0.2);
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
        .dot.red { background: var(--red); }
        .dot.amber { background: var(--amber); }
        .dot.green { background: var(--green); }

        .terminal-title {
            color: var(--green);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .terminal-body {
            padding: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            color: var(--text);
            font-weight: 600;
        }

        p.subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        hr {
            border: 0;
            border-top: 1px solid rgba(57, 255, 136, 0.25);
            margin: 1.5rem 0;
        }

        a {
            color: var(--green);
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            border: 1px solid var(--green);
            padding: 0.4rem 0.8rem;
            border-radius: 2px;
            font-size: 0.85rem;
            transition: background 0.2s, color 0.2s;
        }

        a:hover {
            background: rgba(57, 255, 136, 0.15);
            color: var(--cyan);
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<!--
TODO:
Remove admin test account before production.

Current admin employee ID = 42
-->

<div class="container">
    <div class="terminal-panel">
        <div class="terminal-header">
            <div class="terminal-dots">
                <span class="dot red"></span>
                <span class="dot amber"></span>
                <span class="dot green"></span>
            </div>
            <div class="terminal-title">dashboard_controller.sh</div>
            <div style="width: 42px;"></div>
        </div>
        <div class="terminal-body">
            <h1>Employee Dashboard</h1>
            <p class="subtitle">Welcome to the internal employee portal.</p>
            
            <hr>

            <div class="panel-row">
                <span style="font-family: 'JetBrains Mono', monospace; color: var(--muted);">MY_PROFILE</span>
                <a href="/profile?id=1">
                    VIEW MY PROFILE
                </a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
